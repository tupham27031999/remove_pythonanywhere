<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Test Interface Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="glass-card login-card animate-fade-in">
            <div class="brand">
                <span class="brand-dot"></span>
                <h1>System Test</h1>
            </div>
            <p class="subtitle">Nhập mật mã xác thực để truy cập giao diện kiểm thử hệ thống.</p>
            
            {% if error %}
                <div class="alert alert-error">
                    <span class="alert-icon">⚠️</span>
                    {{ error }}
                </div>
            {% endif %}
            
            <form action="{{ url_for('login') }}" method="POST" class="login-form">
                <div class="form-group">
                    <label for="password">Mật mã xác thực</label>
                    <input type="password" id="password" name="password" placeholder="Nhập mật khẩu..." required autofocus autocomplete="off">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Xác thực</button>
            </form>
            
            <div class="footer-note">
                <p>Giao diện kiểm thử hệ thống bảo mật.</p>
            </div>
        </div>
    </div>
</body>
</html>
